<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Ring -->
  <rect x="16" y="16" width="480" height="480" rx="106" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-opacity="0.25" />

  <!-- "N" monogram, drawn as a single continuous route -->
  <path
    d="M 132 400 L 132 112 L 380 400 L 380 112"
    fill="none"
    stroke="url(#accentGrad)"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Destination ping accent -->
  <circle cx="380" cy="112" r="15" fill="#f8fafc" />
</svg>
